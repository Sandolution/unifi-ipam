name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Python tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Browser-side checks
        run: node tests/js/run.js

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # publish to the GitHub container registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3  # for the arm64 image

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: |
            unifi-ipam:latest
            unifi-ipam:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/unifi-ipam.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker load -i "$RUNNER_TEMP/unifi-ipam.tar"
          docker run -d --name smoke -p 8000:8000 unifi-ipam:latest
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/ | grep -q "No VLANs yet"
          docker rm -f smoke

      - name: Compress
        run: gzip -9 "$RUNNER_TEMP/unifi-ipam.tar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unifi-ipam-image-${{ github.sha }}
          path: ${{ runner.temp }}/unifi-ipam.tar.gz
          retention-days: 30
          compression-level: 0

      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (amd64 and arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
