services:
  unifi-ipam:
    build: .
    container_name: unifi-ipam
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/ipplan.db
      TZ: ${TZ:-UTC}
    volumes:
      - ipam-data:/data
    ports:
      - "8000:8000"   # put your reverse proxy in front of this

volumes:
  ipam-data:
